name: Build Sanechips ZX279128 firmware
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sanechips-firmware-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: write
    env:
      E2631_TREE: ${{ github.workspace }}/../openwrt
      E2631_OUT: ${{ github.workspace }}/../out
      E2631_VERSION: OpenWrt Sanechips Global
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl busybox libelf-dev xsltproc
      - name: Check source before building
        run: make check
      - name: Bootstrap pinned OpenWrt base
        run: make bootstrap
      - name: Check board references against the base tree
        run: make check
      - name: Build, package and verify firmware
        run: make build
      - name: Prepare experimental release
        id: release
        run: |
          set -euo pipefail
          mkdir -p release
          mapfile -t packages < <(find "$E2631_OUT" -maxdepth 1 -name '*.bin' -type f)
          test "${#packages[@]}" -ge 1
          cp "${packages[@]}" release/
          {
            echo "Kit commit: $GITHUB_SHA"
            echo "Base commit: $(git -C "$E2631_TREE" rev-parse HEAD)"
            echo "Packages feed: $(git -C "$E2631_TREE/feeds/packages" rev-parse HEAD)"
            echo "LuCI feed: $(git -C "$E2631_TREE/feeds/luci" rev-parse HEAD)"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Hardware tested: NO"
          } > release/SOURCE-INFO.txt
          (cd release && sha256sum *.bin SOURCE-INFO.txt > SHA256SUMS)
          echo "tag=sanechips-exp-${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Publish only after all build and artifact gates pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Experimental OpenWrt firmware for Sanechips ZX279128 SoC devices (ZXHN E2631, ZXHN E2615, CMCC RAX1800Z).

          Passed static validation, compilation, and artifact packaging gates.
          **Notice: Experimental release. Verify hardware compatibility, flash type, and serial recovery before flashing.**
          - Global default configuration: English UI (`en`), UTC timezone, global pool NTP.
          - Verified on dual-slot SPI-NAND architecture (slot 0 / slot 1 A/B failover).
          - Always verify package integrity against SHA256SUMS before flashing.
          NOTES
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Sanechips ZX279128 experimental ${RELEASE_TAG}" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Stage build logs for archiving
        if: always()
        run: |
          mkdir -p build-logs
          if [ -d "$E2631_OUT" ]; then
            find "$E2631_OUT" -maxdepth 2 -type f -name world.log -exec cp '{}' build-logs/ \;
          fi
      - name: Retain build logs and release files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2631-build-${{ github.run_id }}
          path: |
            build-logs/
            release/
          if-no-files-found: ignore
          retention-days: 14
