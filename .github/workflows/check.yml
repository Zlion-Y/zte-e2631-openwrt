name: Upgrade safety checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install host check tools
        run: sudo apt-get update && sudo apt-get install -y busybox gcc make python3
      - name: Run source, upgrade and slot-decision checks
        run: make check
      - name: Verify upgrade preflight refuses an ordinary host
        run: |
          if /tmp/e2631-fwslot-native upgrade-check; then
            echo 'Unexpectedly accepted a host without E2631 MTD partitions'
            exit 1
          fi
